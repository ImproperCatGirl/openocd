# WCH SWIO over an FT2232/FT232H MPSSE channel.
#
# This uses the usual MPSSE low-byte GPIO wiring:
#   ADBUS0: unused
#   ADBUS1: always-driven-high pull source, connected to ADBUS3 through resistor
#   ADBUS3: SWIO direct connection, driven low or released/input

adapter driver ftdi_rvswd
transport select ddmi

adapter usb vid_pid 0x0403 0x6010 0x0403 0x6014
ftdi_rvswd channel 0
ftdi_rvswd protocol swio

# ADBUS1 is an MPSSE output. ADBUS3 starts high-Z.
ftdi_rvswd layout_init 0x0002 0x0002
ftdi_rvswd layout_signal SWIO_PULL -data 0x0002
ftdi_rvswd layout_signal SWIO -data 0x0008 -oe 0x0008 -input 0x0008
