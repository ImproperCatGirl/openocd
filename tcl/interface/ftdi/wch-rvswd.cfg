# WCH RVSWD over an FT2232/FT232H MPSSE channel.
#
# This assumes the usual MPSSE low-byte wiring:
#   ADBUS0: RVSWD clock
#   ADBUS1: RVSWD output data
#   ADBUS2: RVSWD input data
#
# For one-wire RVSWD, the adapter hardware must safely connect the output and
# input paths to the target SWDIO signal, or provide an output-enable buffer.

adapter driver ftdi_rvswd
transport select ddmi

adapter usb vid_pid 0x0403 0x6010 0x0403 0x6014
ftdi_rvswd channel 0

# Idle high clock, released data. ADBUS1 direction is toggled when RVSWD drives.
ftdi_rvswd layout_init 0x0003 0x0001
ftdi_rvswd layout_signal SWCLK -data 0x0001
ftdi_rvswd layout_signal SWDIO -data 0x0002 -oe 0x0002 -input 0x0004
